# JEI for Sunrise: a native mod on the Sunrise mod API. The launcher
# compiles this crate against the prebuilt SDK of the commit sunrise-mod.toml
# pins. The SDK dependency must be this exact path (E_SDK_SOURCE on main's
# launcher). For a local developer base, link a checkout of the pin:
#   mkdir -p .sunrise/sdk && ln -s <checkout> .sunrise/sdk/api
# The viewer's engine and its tests run without it (engine/).
#
# The package (and so the library other mods call) is `jei`: a mod that
# declares `jei` under [dependencies] in its sunrise-mod.toml reaches the
# category API in `jei::api` (docs/category-api.md).
[package]
name = "jei"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "An item and recipe viewer for Sunrise, a port of Just Enough Items"
publish = false
autotests = false

[lib]
path = "src/lib.rs"

[dependencies]
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
