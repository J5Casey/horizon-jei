id = "jei"
name = "JEI"
version = "0.3.0-braid.1"
description = "An item and recipe viewer: every item beside container screens, with search, recipes, uses, bookmarks and a \"+\" that fills the crafting grid. Other mods add recipe categories through its library API."
authors = ["enderliker", "J5Casey"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, with
# JEI 1.12's GUI sprites (MIT) in assets/.
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
# J5Casey/sunrise braid/sun-base, a local developer base frozen for the whole pack:
# sunrise-org/sunrise main 8d0100ce5c (with #1523, #1535, #1536, #1803, #1811, #1938 merged)
# + sunrise#1802 (LevelRef loot_odds), sunrise#4798 (Holder::Server) and sunrise#4843 (a player's
# drops reach living_drops without a killing blow), the three patches not upstream yet.
# + sunrise 77869de80a (#4648, merged upstream): autosaves keep the owner's attachments.
# + sunrise#6449 (LevelRef::roll_entity_loot: a mob's death loot with no mob), braid/sun-base6.
# Developer base developer-0258744369db936b6e189495eb8dbf571fc387b79e42fd5109aba0727762f403.
sunrise = "8ef6d00509c7254e3120af9fddf2907a104f6eb7"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
