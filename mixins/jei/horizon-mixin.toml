[mod]
id = "jei"
version = "0.2.2-braid.2"
priority = 100

# Braid's build: it pins J5Casey/horizon braid/panel-classic (main a3bf653 and
# NativePanelStyle::Classic, horizon-rust/horizon PR pending), because the
# recipe viewer API it uses (recipe_lookup, recipe categories, panel_style,
# transfer_recipe_all) is not stamped with API numbers yet. Upstream JEI
# names hook points 411 instead (compatibility.json "hooks") and builds on any
# Horizon at least that new.
[compatibility]
horizon_revision = "7dec4d6afd66c261e05a1f389f908926fba13e91"

# runtime.rs becomes the module crate::game::jei.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "jei"
source = "runtime.rs"

# glue.rs becomes the module crate::game::jei_glue: the edges between the
# game's tables/panel and the viewer.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "jei_glue"
source = "glue.rs"

[[injection]]
id = "frame"
kind = "HEAD"
hook = "frame"
hook_version = 1
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "event"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_panel_event"
helper = "event.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "event", ty = "&crate::game::native_hooks::NativePanelEvent", value = "event" },
]

# The overlay: the game's screens and item tooltips.

[[injection]]
id = "screen_post"
kind = "HEAD"
hook = "screen_render_post"
hook_version = 1
helper = "screen_post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
]

# The recipe screen draws after the whole GUI, so a mod's own screen (the
# quest book draws in screen_render_post too) never covers it.
[[injection]]
id = "gui_post"
kind = "HEAD"
hook = "gui_render_post"
hook_version = 1
helper = "gui_post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "mouse_press"
kind = "HEAD"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
helper = "mouse_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "mouse_release"
kind = "HEAD"
hook = "screen_mouse_button_released_pre"
hook_version = 1
helper = "mouse_release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "mouse_drag"
kind = "HEAD"
hook = "screen_mouse_dragged_pre"
hook_version = 1
helper = "mouse_drag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "delta", ty = "[f32; 2]", value = "delta" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "tooltip"
kind = "HEAD"
hook = "tooltip"
hook_version = 1
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]

[[injection]]
id = "tooltip_pre"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip_render_pre"
helper = "tooltip_pre.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]
# The server sends its recipes (the world's data packs merged) to the viewer:
# a data pack's own recipes show, and the "+" names recipes the server has.

[[injection]]
id = "datapack_sync"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_datapack_sync"
helper = "datapack_sync.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "recipe_types", ty = "&mut Vec<String>", value = "&mut *recipe_types" },
]

[[injection]]
id = "recipes_received"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_recipes_received"
helper = "recipes_received.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The recipe screen: its pages turn with the wheel, Escape and Backspace go
# back, the viewer's keys act on its stacks, and it closes with its screen.

[[injection]]
id = "mouse_scroll"
kind = "HEAD"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
helper = "mouse_scroll.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "key_press"
kind = "HEAD"
hook = "screen_key_pressed_pre"
hook_version = 1
helper = "key_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "repeat", ty = "bool", value = "repeat" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen_closing"
kind = "HEAD"
hook = "screen_closing"
hook_version = 1
helper = "screen_closing.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "screen" },
]

# Horizon's recipe viewer API (horizon-rust/horizon#13070): another
# mod's screen asks for a stack's recipes, uses or a key (the quest book), and
# mods declare categories of their own (void fishing, sieves).

[[injection]]
id = "lookup"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_recipe_lookup"
helper = "lookup.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&crate::game::native_hooks::NativeStack", value = "stack" },
  { name = "lookup", ty = "&crate::game::native_hooks::NativeRecipeLookup", value = "lookup" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]
